  "1-0-0": { title: "Forex là gì?", content: `**Forex (Foreign Exchange)** là thị trường trao đổi ngoại tệ lớn nhất thế giới với khối lượng giao dịch trung bình hơn **$7.5 nghìn tỷ USD mỗi ngày** (theo BIS 2022).

### Lịch sử hình thành
- **1944 - Bretton Woods:** Hệ thống tỷ giá cố định ra đời, các đồng tiền được neo vào USD, USD neo vào vàng ($35/oz).
- **1971 - Nixon Shock:** Tổng thống Nixon bãi bỏ việc đổi USD ra vàng, kết thúc Bretton Woods.
- **1973:** Hệ thống tỷ giá thả nổi chính thức bắt đầu → Forex hiện đại ra đời.
- **1990s:** Internet phát triển, retail trader bắt đầu tiếp cận thị trường qua broker online.

### Cấu trúc thị trường OTC
Forex là thị trường **phi tập trung (Over-The-Counter)**. Không có sàn giao dịch trung tâm như chứng khoán.

**Các tầng tham gia:**
| Tầng | Người tham gia | Vai trò |
|------|---------------|---------|
| Tier 1 | Ngân hàng lớn (JP Morgan, Citi, Deutsche) | Market Makers, cung cấp thanh khoản |
| Tier 2 | Ngân hàng nhỏ, quỹ đầu tư | Giao dịch liên ngân hàng |
| Tier 3 | Broker, ECN | Trung gian cho retail trader |
| Tier 4 | Retail Traders | Chiếm ~5-6% volume |

**Đặc điểm:**
- Hoạt động 24/5 (từ thứ 2 đến thứ 6)
- Thanh khoản cực cao, đặc biệt các cặp Major
- Chi phí giao dịch thấp (spread chỉ từ 0.1 pip)` },

  "1-0-1": { title: "Các phiên giao dịch", content: `### Bốn phiên giao dịch chính

Forex hoạt động 24 giờ nhờ các trung tâm tài chính trên toàn cầu mở cửa luân phiên.

| Phiên | Giờ mở (GMT) | Giờ VN (GMT+7) | Đặc điểm |
|-------|-------------|----------------|----------|
| **Sydney** | 22:00 - 07:00 | 05:00 - 14:00 | Thanh khoản thấp, biến động nhẹ |
| **Tokyo** | 00:00 - 09:00 | 07:00 - 16:00 | JPY, AUD pairs hoạt động mạnh |
| **London** | 08:00 - 17:00 | 15:00 - 00:00 | Volume cao nhất (~35% tổng volume) |
| **New York** | 13:00 - 22:00 | 20:00 - 05:00 | USD pairs biến động mạnh |

### Các khung giờ Overlap quan trọng
- **Tokyo-London overlap (15:00-16:00 VN):** Biến động tăng, cơ hội với EUR/JPY, GBP/JPY
- **London-New York overlap (20:00-00:00 VN):** **Khung giờ biến động MẠNH NHẤT** trong ngày — hơn 70% biến động xảy ra ở đây

### Mẹo thực chiến
- **Scalper/Day Trader:** Tập trung phiên London và overlap London-NY
- **Swing Trader:** Phân tích khi thị trường yên tĩnh (cuối phiên NY), entry khi London mở
- **Tránh giao dịch:** 30 phút đầu mỗi phiên (spread mở rộng) và thứ 6 cuối ngày` },

  "1-0-2": { title: "Các cặp tiền tệ", content: `### Phân loại cặp tiền

  "1-0-3": { title: "Cách đọc báo giá", content: `### Base Currency & Quote Currency

Trong cặp **EUR/USD = 1.0850:**
- **EUR** = Base Currency (đồng tiền cơ sở)
- **USD** = Quote Currency (đồng tiền yết giá)
- Ý nghĩa: 1 EUR = 1.0850 USD

**Quy tắc:**
- **Mua (Buy/Long):** Bạn mua Base, bán Quote → Kỳ vọng giá TĂNG
- **Bán (Sell/Short):** Bạn bán Base, mua Quote → Kỳ vọng giá GIẢM

### Bid / Ask / Spread

| Thuật ngữ | Ý nghĩa | Ví dụ |
|-----------|---------|-------|
| **Bid** | Giá bạn BÁN được | 1.08**48** |
| **Ask** | Giá bạn MUA được | 1.08**50** |
| **Spread** | Ask - Bid = Chi phí giao dịch | 0.0002 = **2 pips** |

**Spread thay đổi theo:**
- Thời điểm: Overlap → spread thấp; đêm → spread cao
- Tin tức: Trước/sau NFP, FOMC → spread mở rộng đột biến
- Loại tài khoản: ECN thường spread thấp hơn + commission

### Ví dụ thực tế
Bạn mua EUR/USD tại Ask = 1.0850. Ngay lập tức vị thế của bạn đang lỗ 2 pip (spread). Giá cần tăng lên trên 1.0850 bạn mới bắt đầu có lãi.` },

  "1-0-4": { title: "Pip, Pipette, Point", content: `### Pip là gì?

**Pip (Percentage In Point)** là đơn vị đo lường nhỏ nhất của sự thay đổi giá.

**Quy tắc:**
- Hầu hết các cặp: **1 pip = 0.0001** (chữ số thập phân thứ 4)
- Các cặp JPY: **1 pip = 0.01** (chữ số thập phân thứ 2)

**Ví dụ:**
- EUR/USD: 1.0850 → 1.0860 = tăng **10 pips**
- USD/JPY: 149.50 → 149.80 = tăng **30 pips**

### Pipette (Point)
- **Pipette = 1/10 pip = 0.00001** (chữ số thứ 5)
- USD/JPY: pipette = 0.001 (chữ số thứ 3)
- Broker hiện nay thường báo giá 5 chữ số (fractional pip)

### Cách tính giá trị Pip

**Công thức:** Pip Value = (Pip / Tỷ giá) × Lot Size

| Lot Size | Đơn vị | Giá trị 1 pip (USD pairs) |
|----------|--------|---------------------------|
| Standard | 100,000 | ~$10 |
| Mini | 10,000 | ~$1 |
| Micro | 1,000 | ~$0.10 |
| Nano | 100 | ~$0.01 |

**Ví dụ thực tế:**
Bạn mua 1 lot EUR/USD, giá tăng 50 pips → Lợi nhuận = 50 × $10 = **$500**
Bạn mua 0.1 lot (mini), giá tăng 50 pips → Lợi nhuận = 50 × $1 = **$50**` },

  "1-0-5": { title: "Lot Size", content: `### Các loại Lot Size

| Loại | Đơn vị tiền | Ký hiệu MT4/5 | 1 pip (USD pair) |
|------|------------|----------------|------------------|
| **Standard** | 100,000 | 1.00 | $10 |
| **Mini** | 10,000 | 0.10 | $1 |
| **Micro** | 1,000 | 0.01 | $0.10 |

### Chọn Lot Size phù hợp

**Nguyên tắc vàng:** Lot size phải tính dựa trên **mức rủi ro cho phép**, KHÔNG phải cảm tính.

**Công thức:**
\`\`\`
Lot Size = (Tài khoản × % Rủi ro) / (SL pips × Pip Value)
\`\`\`

**Ví dụ:**
- Tài khoản: $1,000
- Rủi ro: 2% = $20
- Stop Loss: 50 pips
- Pip Value (micro lot): $0.10

→ Lot Size = $20 / (50 × $0.10) = $20 / $5 = **0.04 lot** (4 micro lots)

### Lời khuyên
- Mới bắt đầu: Dùng **micro lot (0.01)** để quản lý rủi ro
- Không bao giờ "all-in" toàn bộ vốn vào 1 lệnh
- Tăng lot size dần khi equity tăng, KHÔNG tăng theo cảm xúc` },

  "1-0-6": { title: "Leverage & Margin", content: `### Leverage (Đòn bẩy)

Leverage cho phép bạn kiểm soát một vị thế LỚN HƠN số vốn thực có.

| Leverage | Vốn cần | Kiểm soát | Margin Required |
|----------|---------|-----------|-----------------|
| 1:1 | $100,000 | $100,000 | 100% |
| 1:50 | $2,000 | $100,000 | 2% |
| 1:100 | $1,000 | $100,000 | 1% |
| 1:500 | $200 | $100,000 | 0.2% |

### Margin

**Các thuật ngữ cần nhớ:**
- **Used Margin:** Số tiền bị "khóa" để duy trì vị thế mở
- **Free Margin:** Equity - Used Margin = Tiền còn lại để mở lệnh mới
- **Margin Level:** (Equity / Used Margin) × 100%

### Margin Call & Stop Out
- **Margin Call:** Khi Margin Level xuống mức cảnh báo (thường 100%) — Broker cảnh báo bạn nạp thêm tiền
- **Stop Out:** Khi Margin Level quá thấp (thường 20-50%) — Broker TỰ ĐỘNG đóng lệnh thua lỗ nhất

### ⚠️ Cảnh báo quan trọng
**Leverage là con dao hai lưỡi:**
- Leverage 1:100 → Giá đi đúng 1% = Lãi 100% vốn
- Leverage 1:100 → Giá đi sai 1% = **MẤT 100% vốn**

**Quy tắc:** Leverage cao không có nghĩa bạn phải dùng hết. Luôn quản lý lot size theo % rủi ro, KHÔNG theo leverage.` },

  "1-0-7": { title: "Swap / Rollover", content: `### Swap là gì?

**Swap (Rollover)** là phí/lãi qua đêm khi bạn giữ lệnh qua 00:00 giờ server (thường 00:00 GMT).

**Nguyên lý:** Mỗi đồng tiền có lãi suất riêng. Khi bạn mua 1 cặp tiền, bạn đang vay đồng Quote và gửi đồng Base.

### Cách tính Swap

**Swap = (Lãi suất Base - Lãi suất Quote) × Lot Size / 365**

**Ví dụ:**
- Mua AUD/JPY: Lãi suất AUD = 4.35%, JPY = -0.10%
- Swap dương: Bạn NHẬN tiền mỗi đêm giữ lệnh Buy
- Bán AUD/JPY: Swap âm — bạn TRẢ tiền mỗi đêm

### Triple Swap Wednesday
Vào **thứ 4**, swap bị tính **gấp 3 lần** (bù cho thứ 7 và CN không tính).

### Carry Trade
Chiến lược mua đồng tiền lãi suất cao, bán đồng tiền lãi suất thấp để hưởng swap dương.

**Ví dụ kinh điển:** Mua NZD/JPY, AUD/JPY — lãi suất NZD/AUD cao, JPY gần 0%.

⚠️ **Rủi ro:** Biến động tỷ giá có thể xóa sạch lợi nhuận swap.` },

  "1-0-8": { title: "Các loại lệnh", content: `### Market Order (Lệnh thị trường)
Mua/bán **ngay lập tức** tại giá hiện tại. Dùng khi cần vào lệnh nhanh.

### Pending Orders (Lệnh chờ)

| Loại lệnh | Khi nào dùng | Ví dụ |
|-----------|-------------|-------|
| **Buy Limit** | Mua ở giá THẤP HƠN hiện tại | Giá đang 1.0850, đặt Buy Limit 1.0800 |
| **Sell Limit** | Bán ở giá CAO HƠN hiện tại | Giá đang 1.0850, đặt Sell Limit 1.0900 |
| **Buy Stop** | Mua ở giá CAO HƠN hiện tại | Breakout trade: đặt Buy Stop trên resistance |
| **Sell Stop** | Bán ở giá THẤP HƠN hiện tại | Breakout trade: đặt Sell Stop dưới support |

### Stop Loss & Take Profit
- **Stop Loss (SL):** Tự động đóng lệnh khi lỗ đến mức chấp nhận → **BẢO VỆ VỐN**
- **Take Profit (TP):** Tự động đóng lệnh khi đạt mục tiêu lợi nhuận

### Trailing Stop
Stop Loss **di chuyển theo giá** khi giá đi đúng hướng.

Ví dụ: Buy EUR/USD tại 1.0850, Trailing Stop 30 pips:
- Giá lên 1.0900 → SL tự động di chuyển lên 1.0870
- Giá lên 1.0950 → SL tự động di chuyển lên 1.0920
- Giá quay đầu giảm → SL giữ nguyên tại 1.0920

### OCO (One Cancels Other)
Đặt 2 lệnh chờ — khi 1 lệnh được kích hoạt, lệnh còn lại tự động hủy. Dùng cho breakout trading.` },

  "1-1-0": { title: "Chọn broker uy tín", content: `### Tiêu chí đánh giá Broker

**1. Regulation (Giấy phép)** — QUAN TRỌNG NHẤT
| Hạng | Cơ quan quản lý | Quốc gia |
|------|----------------|---------|
| Tier 1 | FCA, ASIC, CFTC/NFA | Anh, Úc, Mỹ |
| Tier 2 | CySEC, FMA, MAS | Síp, NZ, Singapore |
| Tier 3 | FSA, IFSC, SVG | Offshore |

⚠️ Tránh broker không có regulation hoặc chỉ có giấy phép offshore.

**2. Spread & Commission**
- ECN Account: Spread từ 0.0 pip + commission ($3-7/lot)
- Standard Account: Spread từ 1.0 pip, không commission
- So sánh tổng chi phí, không chỉ nhìn spread

**3. Execution Quality**
- Slippage: Chênh lệch giá khi lệnh được thực hiện
- Requote: Broker từ chối giá, báo giá mới
- Execution Speed: Dưới 100ms là tốt

**4. Deposit/Withdrawal**
- Phương thức: Bank transfer, Visa, Skrill, Crypto...
- Tốc độ rút tiền: 1-3 ngày làm việc
- Phí rút: Miễn phí hoặc rất thấp

**Broker phổ biến cho trader Việt:** IC Markets, Pepperstone, Exness, XM, FBS (tự research thêm).` },

  "1-1-1": { title: "MetaTrader 4/5 & cTrader", content: `### MetaTrader 4 (MT4)

- Hỗ trợ **Expert Advisor (EA)** — robot giao dịch tự động

### MetaTrader 5 (MT5)

- Hỗ trợ **MQL5** — mạnh hơn MQL4

- Cho phép hedging VÀ netting

### Cách thiết lập cơ bản

2. **Template:** Tạo template riêng với màu sắc dễ nhìn

4. **Alerts:** Thiết lập cảnh báo giá tại các vùng quan trọng
5. **Profiles:** Lưu workspace cho từng cặp tiền hoặc chiến lược

### Phím tắt quan trọng MT4/5
- **F9:** Mở cửa sổ New Order
- **Ctrl + T:** Mở/đóng Terminal
- **Ctrl + Y:** Hiện đường phân cách thời gian
- **Ctrl + G:** Bật/tắt Grid` },

  "1-1-2": { title: "Tài khoản Demo", content: `### Tại sao phải trade Demo?

Demo là bước **KHÔNG THỂ BỎ QUA**. Đây là nơi bạn:
- Làm quen platform mà không mất tiền thật
- Thực hành đặt lệnh, SL, TP, trailing stop
- Test chiến lược và xây dựng hệ thống
- Rèn luyện kỷ luật và thói quen giao dịch

### Cách sử dụng Demo hiệu quả

**Sai lầm phổ biến:** Trade demo như chơi game → vào lệnh bừa → không học được gì.

**Cách đúng:**
1. Đặt vốn demo **bằng với số vốn thật bạn dự định dùng** (ví dụ: $500-$1,000)
2. Trade **đúng lot size** bạn sẽ dùng trên live
3. Ghi **Trading Journal** cho MỌI lệnh demo
4. Tuân thủ **Trading Plan** nghiêm ngặt
5. Trade demo ít nhất **3-6 tháng** trước khi lên live

### Khi nào chuyển sang Live?
✅ Profitable ít nhất 3 tháng liên tiếp trên demo
✅ Drawdown trong kiểm soát (<15-20%)
✅ Có Trading Plan rõ ràng và tuân thủ tốt
✅ Hiểu rõ risk management
✅ Tâm lý ổn định, không vào lệnh theo cảm xúc` },

  "1-1-3": { title: "TradingView", content: `### Tại sao nên dùng TradingView?

- **Charting mạnh nhất:** Hơn 100+ indicator, drawing tools chuyên nghiệp
- **Multi-timeframe:** Xem nhiều TF cùng lúc
- **Social Network:** Chia sẻ ý tưởng, học từ trader khác
- **Pine Script:** Tự viết indicator và strategy
- **Cloud-based:** Sử dụng trên mọi thiết bị

### Thiết lập TradingView cho Forex

**1. Chart Settings:**
- Candlestick chart, dark theme
- Tắt "Scale Price Chart Only"
- Bật "Auto Scale"

**2. Indicator cơ bản nên thêm:**
- EMA 20, 50, 200
- RSI (14)
- Volume (nếu có)

**3. Layout:**
- Multi-chart layout: TF lớn (D1) bên trái, TF nhỏ (H1/M15) bên phải
- Watchlist: Theo dõi 5-8 cặp tiền chính

**4. Alerts:**
- Đặt alert tại vùng S/R quan trọng
- Alert khi indicator đạt ngưỡng (RSI > 70, etc.)
- Nhận thông báo qua email/app` },

  "1-1-4": { title: "Economic Calendar", content: `### Economic Calendar là gì?

Lịch kinh tế liệt kê tất cả **sự kiện, tin tức, báo cáo kinh tế** sắp được công bố, ảnh hưởng trực tiếp đến thị trường.

### Cách đọc Economic Calendar

**Mức tác động:**
- 🔴 **High Impact:** NFP, CPI, FOMC, GDP — Biến động rất mạnh, có thể 50-200 pips
- 🟡 **Medium Impact:** PMI, Retail Sales — Biến động vừa phải
- ⚪ **Low Impact:** Ít ảnh hưởng

**Các cột quan trọng:**
- **Previous:** Số liệu kỳ trước
- **Forecast:** Dự báo của giới phân tích
- **Actual:** Số liệu thực tế (công bố lúc event)

### Quy tắc giao dịch khi có tin
- **Actual > Forecast:** Tích cực cho đồng tiền → có thể tăng giá
- **Actual < Forecast:** Tiêu cực → có thể giảm giá
- **Surprise Factor:** Chênh lệch càng lớn → biến động càng mạnh

### Công cụ Calendar phổ biến
- **Forex Factory** (forexfactory.com) — Phổ biến nhất
- **Investing.com** — Đầy đủ, có app mobile
- **DailyFX Calendar** — Giao diện đẹp
- **MT5 Built-in Calendar** — Tiện lợi` },

  "1-1-5": { title: "Xây dựng Workspace", content: `### Setup giao dịch chuyên nghiệp

  // Phase 2 - Technical Analysis
  "2-0-0": { title: "Cấu trúc thị trường", content: `### Market Structure

Cấu trúc thị trường là **nền tảng quan trọng nhất** của Price Action. Hiểu được cấu trúc = hiểu được xu hướng.

### Uptrend (Xu hướng tăng)
- Giá tạo **Higher High (HH)** và **Higher Low (HL)** liên tiếp
- Mỗi đỉnh cao hơn đỉnh trước
- Mỗi đáy cao hơn đáy trước
- **Chiến lược:** Buy tại vùng HL (pullback)

### Downtrend (Xu hướng giảm)
- Giá tạo **Lower High (LH)** và **Lower Low (LL)** liên tiếp
- Mỗi đỉnh thấp hơn đỉnh trước
- Mỗi đáy thấp hơn đáy trước
- **Chiến lược:** Sell tại vùng LH (pullback)

### Sideways/Range
- Giá dao động giữa vùng Support và Resistance
- Không tạo HH/HL hoặc LH/LL rõ ràng
- **Chiến lược:** Buy tại Support, Sell tại Resistance

### Break of Structure (BOS)
Khi giá phá vỡ cấu trúc hiện tại:
- Trong uptrend, giá phá xuống dưới HL gần nhất → **Cảnh báo đảo chiều**
- Trong downtrend, giá phá lên trên LH gần nhất → **Cảnh báo đảo chiều**

⚠️ **Luôn xác nhận BOS bằng nến đóng cửa (close), không phải bóng nến (wick).**` },

  "2-0-1": { title: "Mô hình nến Nhật", content: `### Candlestick Patterns — Tất cả mô hình quan trọng

**Nến đảo chiều đơn (Single Candle):**

| Mô hình | Hình dáng | Ý nghĩa |
|---------|-----------|---------|
| **Hammer** | Thân nhỏ, râu dưới dài (≥2x thân) | Đảo chiều tăng tại đáy |
| **Inverted Hammer** | Thân nhỏ, râu trên dài | Đảo chiều tăng tiềm năng |
| **Shooting Star** | Thân nhỏ, râu trên dài | Đảo chiều giảm tại đỉnh |
| **Hanging Man** | Giống Hammer nhưng ở đỉnh | Đảo chiều giảm |
| **Doji** | Open ≈ Close | Bất quyết, có thể đảo chiều |

**Nến đảo chiều đôi (Double Candle):**
- **Bullish Engulfing:** Nến xanh "nuốt trọn" nến đỏ trước → Đảo chiều tăng
- **Bearish Engulfing:** Nến đỏ "nuốt trọn" nến xanh trước → Đảo chiều giảm
- **Bullish/Bearish Harami:** Nến sau nằm trong thân nến trước → Tín hiệu yếu hơn Engulfing

**Mô hình 3 nến:**
- **Morning Star:** Nến đỏ + Doji/thân nhỏ + Nến xanh lớn → Đảo chiều tăng mạnh
- **Evening Star:** Nến xanh + Doji/thân nhỏ + Nến đỏ lớn → Đảo chiều giảm mạnh
- **Three White Soldiers:** 3 nến xanh liên tiếp, mỗi nến đóng cửa cao hơn → Uptrend mạnh
- **Three Black Crows:** 3 nến đỏ liên tiếp → Downtrend mạnh

### Lưu ý quan trọng
- Mô hình nến **PHẢI** xuất hiện tại vùng S/R, supply/demand quan trọng mới có giá trị
- Nến trên TF lớn (H4, D1) đáng tin hơn TF nhỏ (M5, M15)
- Luôn **chờ nến đóng cửa** mới xác nhận mô hình` },

  "2-0-2": { title: "Support & Resistance", content: `### Support (Hỗ trợ)
Vùng giá mà **lực mua mạnh hơn lực bán**, giá có xu hướng bật lên.

### Resistance (Kháng cự)  
Vùng giá mà **lực bán mạnh hơn lực mua**, giá có xu hướng quay đầu giảm.

### Cách xác định S/R mạnh
1. **Số lần test:** Giá đã chạm vùng đó bao nhiêu lần? Càng nhiều → càng mạnh
2. **Timeframe:** S/R trên D1, W1 mạnh hơn H1, M15
3. **Volume:** Nến tại vùng S/R có volume cao → xác nhận mạnh
4. **Phản ứng giá:** Giá phản ứng mạnh (nến lớn, rejection wick dài) → S/R mạnh

### S/R Flip (Role Reversal)
Khi Support bị phá vỡ → Trở thành Resistance mới (và ngược lại).

Đây là một trong những concept **quan trọng nhất** trong trading:
- Giá phá xuống support → Pullback lên test lại vùng đó (giờ là resistance) → Entry Sell
- Giá phá lên resistance → Pullback xuống test lại (giờ là support) → Entry Buy

### Vùng (Zone) vs Đường (Line)
- S/R là **VÙNG**, không phải đường chính xác
- Vẽ S/R zone bằng rectangle tool, bao phủ wicks và bodies` },

  "2-1-0": { title: "Moving Averages", content: `### Các loại Moving Average

**SMA (Simple Moving Average):**
- Trung bình cộng đơn giản của N nến gần nhất
- SMA 20 = Trung bình 20 nến gần nhất
- Ưu: Ổn định, ít nhiễu. Nhược: Chậm phản ứng

**EMA (Exponential Moving Average):**
- Trọng số cao hơn cho giá gần nhất
- Phản ứng nhanh hơn SMA
- Phổ biến: EMA 9, 21, 50, 200

### Chiến lược sử dụng

**1. Dynamic Support/Resistance:**
- EMA 20/21: S/R ngắn hạn (cho scalping/day trading)
- EMA 50: S/R trung hạn (cho swing trading)
- EMA/SMA 200: S/R dài hạn — **MA quan trọng nhất**

**2. Golden Cross & Death Cross:**
- **Golden Cross:** MA ngắn cắt LÊN MA dài → Tín hiệu tăng
- **Death Cross:** MA ngắn cắt XUỐNG MA dài → Tín hiệu giảm
- Phổ biến: EMA 50 & EMA 200

**3. MA Ribbon:**
- Dùng nhiều MA (9, 21, 50, 100, 200) tạo "dải băng"
- Khi các MA xếp theo thứ tự → Trend mạnh
- Khi các MA đan xen → Sideways, không nên trade

### Mẹo thực chiến
- Giá trên EMA 200 → Ưu tiên Buy
- Giá dưới EMA 200 → Ưu tiên Sell
- Không dùng MA crossover một mình để entry — cần thêm xác nhận` },

  "2-1-1": { title: "RSI - Relative Strength Index", content: `### RSI là gì?

RSI đo **sức mạnh tương đối** giữa lực mua và lực bán trong N kỳ (mặc định: 14).

**Công thức:** RSI = 100 - (100 / (1 + RS))
Trong đó RS = Trung bình tăng / Trung bình giảm

### Vùng Overbought & Oversold
- **RSI > 70:** Overbought (quá mua) → Cảnh báo có thể giảm
- **RSI < 30:** Oversold (quá bán) → Cảnh báo có thể tăng
- **RSI = 50:** Vùng trung tính, ranh giới bull/bear

⚠️ **SAI LẦM PHỔ BIẾN:** RSI > 70 ≠ phải bán ngay! Trong uptrend mạnh, RSI có thể duy trì trên 70 rất lâu.

### RSI Divergence — Tín hiệu MẠNH

**Bullish Divergence (Phân kỳ tăng):**
- Giá tạo Lower Low nhưng RSI tạo Higher Low
- → Momentum giảm đang yếu đi → Có thể đảo chiều tăng

**Bearish Divergence (Phân kỳ giảm):**
- Giá tạo Higher High nhưng RSI tạo Lower High
- → Momentum tăng đang yếu đi → Có thể đảo chiều giảm

**Hidden Divergence:** Tín hiệu tiếp tục xu hướng
- Hidden Bullish: Giá HL + RSI LL → Uptrend tiếp tục
- Hidden Bearish: Giá LH + RSI HH → Downtrend tiếp tục

### Cách dùng RSI tốt nhất
- Kết hợp RSI divergence với vùng S/R
- RSI trên TF H4, D1 đáng tin hơn M5, M15` },

  "2-1-9": { title: "Fibonacci", content: `### Fibonacci trong Trading

Fibonacci Retracement dựa trên dãy số Fibonacci (1, 1, 2, 3, 5, 8, 13, 21...) và tỷ lệ vàng.

### Fibonacci Retracement — Các mức quan trọng

| Mức | Ý nghĩa | Cách dùng |
|-----|---------|-----------|
| **23.6%** | Retracement nông | Trend rất mạnh |
| **38.2%** | Retracement phổ biến | Entry tốt trong trend mạnh |
| **50%** | Mức tâm lý (không phải Fib thật) | Rất phổ biến |
| **61.8%** | **"Golden Ratio"** — Mức QUAN TRỌNG NHẤT | Entry lý tưởng |
| **78.6%** | Retracement sâu | Cẩn thận, có thể đảo chiều |

### Cách vẽ Fibonacci Retracement
1. Xác định swing point rõ ràng (đỉnh & đáy)
2. **Uptrend:** Kéo từ **Swing Low → Swing High**
3. **Downtrend:** Kéo từ **Swing High → Swing Low**
4. Chờ giá pullback về các mức Fib → Tìm entry

### Fibonacci Extension — Đặt Take Profit
Các mức extension phổ biến: 127.2%, 161.8%, 200%, 261.8%

### Confluence — Sức mạnh thật sự
Fib mạnh nhất khi **trùng với** các yếu tố khác:
- Fib 61.8% + S/R zone → **Rất mạnh**
- Fib 50% + EMA 50 → **Confluence tốt**
- Fib + Order Block + FVG → **SMC entry**` },

  // Phase 3 - Fundamental Analysis
  "3-0-0": { title: "GDP, CPI, PPI, PCE", content: `### Các chỉ số kinh tế quan trọng

**GDP (Gross Domestic Product)**
- Tổng sản phẩm quốc nội — đo lường quy mô kinh tế
- Công bố: Hàng quý (Advance, Preliminary, Final)
- GDP tăng → Kinh tế mạnh → Đồng tiền có xu hướng tăng
- GDP giảm 2 quý liên tiếp = **Suy thoái (Recession)**

**CPI (Consumer Price Index)**
- Chỉ số giá tiêu dùng — đo lường **lạm phát**
- **Core CPI:** Loại bỏ Food & Energy (biến động mạnh)
- CPI cao → NHTW có thể **tăng lãi suất** → Đồng tiền tăng
- CPI thấp → NHTW có thể **giảm lãi suất** → Đồng tiền giảm
- Mục tiêu lạm phát của FED: 2%

**PPI (Producer Price Index)**
- Chỉ số giá sản xuất — "leading indicator" của CPI
- PPI tăng → Chi phí sản xuất tăng → CPI có thể tăng theo

**PCE (Personal Consumption Expenditures)**
- Chỉ số chi tiêu tiêu dùng cá nhân
- **Core PCE** là thước đo lạm phát **ưa thích của FED**
- Quan trọng hơn CPI đối với quyết định lãi suất của FED

### Cách trade khi có tin
- So sánh **Actual vs Forecast** (không phải Previous)
- Chênh lệch càng lớn → Biến động càng mạnh
- Chờ 5-15 phút sau tin để tránh whipsaw` },

  "3-0-1": { title: "Non-Farm Payrolls (NFP)", content: `### NFP là gì?

**Non-Farm Payrolls** là báo cáo việc làm phi nông nghiệp của Mỹ, công bố vào **thứ 6 đầu tiên hàng tháng, lúc 8:30 ET (19:30 VN)**.

**Tại sao quan trọng?**
- Phản ánh sức khỏe thị trường lao động Mỹ
- Ảnh hưởng trực tiếp đến quyết định lãi suất của FED
- Là tin tức **biến động mạnh nhất** hàng tháng (50-200+ pips)

### Các thành phần NFP
- **Jobs Added:** Số việc làm mới tạo ra (headline number)
- **Unemployment Rate:** Tỷ lệ thất nghiệp
- **Average Hourly Earnings:** Thu nhập trung bình/giờ (đo lạm phát tiền lương)

### Cách đọc NFP

| Kịch bản | Tác động USD |
|----------|-------------|
| Jobs cao + Earnings cao | USD tăng mạnh |
| Jobs cao + Earnings thấp | USD tăng vừa |
| Jobs thấp + Earnings cao | Hỗn loạn, khó đoán |
| Jobs thấp + Earnings thấp | USD giảm mạnh |

### Chiến lược trade NFP an toàn
1. **Tránh trade trước NFP 30 phút** — spread mở rộng
2. **Chờ nến 15 phút đầu đóng** — tránh whipsaw
3. **Dùng pending order:** Buy Stop + Sell Stop (straddle)
4. **Giảm lot size** — biến động lớn = rủi ro lớn
5. **Hoặc đơn giản: KHÔNG TRADE NFP** khi mới bắt đầu` },

  // Phase 4 - Trading Strategies
  "4-0-0": { title: "Order Block (OB)", content: `### Order Block là gì?

**Order Block** là vùng giá nơi **Smart Money (ngân hàng, tổ chức lớn)** đặt lệnh lớn, tạo ra sự mất cân bằng cung-cầu.

### Cách xác định Order Block

**Bullish Order Block:**
1. Tìm nến đỏ/giảm **cuối cùng** trước một cú tăng mạnh (impulsive move up)
2. Đánh dấu vùng từ **Open đến Low** của nến đỏ đó
3. Đó là vùng mua tiềm năng

**Bearish Order Block:**
1. Tìm nến xanh/tăng **cuối cùng** trước một cú giảm mạnh
2. Đánh dấu vùng từ **Open đến High** của nến xanh đó
3. Đó là vùng bán tiềm năng

### Điều kiện OB hợp lệ
- OB phải tạo ra **Break of Structure (BOS)** — đẩy giá phá cấu trúc
- OB chưa bị **mitigated** (giá chưa quay lại test)
- OB trên TF lớn (H4, D1) mạnh hơn TF nhỏ

### Cách trade Order Block
1. Xác định OB trên TF lớn (H4/D1)
2. Chờ giá pullback về vùng OB
3. Chuyển sang TF nhỏ (M15/H1) tìm confirmation
4. Entry với SL đặt dưới/trên OB
5. TP tại vùng liquidity hoặc OB đối diện

### OB + FVG Confluence
Khi Order Block **trùng với Fair Value Gap** → Setup rất mạnh, xác suất cao.` },

  "4-0-1": { title: "Fair Value Gap (FVG)", content: `### FVG / Imbalance là gì?

**Fair Value Gap** là vùng giá mà thị trường di chuyển **quá nhanh**, tạo ra khoảng trống — nơi cung cầu chưa cân bằng.

### Cách xác định FVG

Cần 3 nến liên tiếp:
- **Bullish FVG:** High của nến 1 THẤP HƠN Low của nến 3 → Khoảng trống giữa = FVG
- **Bearish FVG:** Low của nến 1 CAO HƠN High của nến 3 → Khoảng trống giữa = FVG

### Tại sao FVG quan trọng?

Thị trường có xu hướng **quay lại "lấp đầy"** các FVG trước khi tiếp tục xu hướng. Đây là nơi Smart Money "rebalance" vị thế.

### Cách trade FVG
1. Xác định FVG trên chart (H1, H4, D1)
2. Chờ giá pullback về vùng FVG
3. Entry tại **50% của FVG** (Consequent Encroachment — CE)
4. SL đặt ngoài FVG
5. TP tại swing high/low tiếp theo

### FVG Rules
- FVG chưa bị lấp (unfilled) = vẫn hợp lệ
- FVG đã bị lấp 1 phần = vẫn có thể phản ứng tại CE (50%)
- FVG đã bị lấp hoàn toàn = invalidated
- FVG trên TF cao = mạnh hơn, cần nhiều thời gian hơn để fill` },

  // Phase 5 - Risk Management
  "5-0-0": { title: "Quy tắc 1-2%", content: `### Quy tắc quản lý rủi ro số 1

**KHÔNG BAO GIỜ rủi ro quá 1-2% tài khoản cho MỘT lệnh.**

Đây là quy tắc **QUAN TRỌNG NHẤT** trong trading. Mọi trader chuyên nghiệp đều tuân thủ.

### Tại sao 1-2%?

Với rủi ro 2% mỗi lệnh, bạn cần thua **35 lệnh liên tiếp** để mất 50% tài khoản. Xác suất gần như bằng 0.

| Rủi ro/lệnh | Số lệnh thua để mất 50% | Xác suất xảy ra |
|-------------|------------------------|-----------------|
| 2% | 35 lệnh | Gần 0% |
| 5% | 14 lệnh | Rất thấp |
| 10% | 7 lệnh | Có thể xảy ra! |
| 25% | 3 lệnh | Rất dễ xảy ra! |

### Công thức tính Lot Size

\`\`\`
Lot Size = (Account Balance × Risk%) / (SL pips × Pip Value per Lot)
\`\`\`

**Ví dụ thực tế:**
- Account: $5,000
- Risk: 1% = $50
- SL: 40 pips
- Pip Value (1 standard lot EUR/USD): $10

→ Lot Size = $50 / (40 × $10) = $50 / $400 = **0.125 lot**
→ Làm tròn xuống: **0.12 lot**

### Quy tắc mở rộng
- **Max 3-5 lệnh cùng lúc** → Tổng rủi ro ≤ 6-10%
- **Daily Loss Limit:** Thua 3% trong ngày → DỪNG trade
- **Weekly Loss Limit:** Thua 6% trong tuần → Nghỉ, review lại` },

  // Phase 6 - Psychology
  "6-0-0": { title: "FOMO", content: `### FOMO — Fear of Missing Out

**FOMO** là nỗi sợ bỏ lỡ cơ hội, khiến trader vào lệnh **không theo plan**, thường khi thấy giá đang chạy mạnh.

### Dấu hiệu FOMO
- Thấy giá tăng/giảm mạnh → Muốn nhảy vào ngay
- Thấy người khác khoe lệnh thắng → Muốn trade giống họ
- Vào lệnh không có setup rõ ràng, chỉ vì "sợ lỡ"
- Tăng lot size bất thường vì muốn bù lại cơ hội đã bỏ lỡ

### Tại sao FOMO nguy hiểm?
- Entry tại vùng giá xấu (đuổi giá)
- Không có SL hợp lý (vì vào muộn, SL quá xa)
- RR ratio bất lợi
- Cảm xúc chi phối thay vì logic

### Cách khắc phục

**1. Có Trading Plan rõ ràng:**
- Biết chính xác mình tìm setup gì
- Nếu không có setup → Không trade. Đơn giản vậy thôi.

**2. Nhắc nhở bản thân:**
- "Thị trường mở cửa 5 ngày/tuần, 52 tuần/năm"
- "Cơ hội LUÔN LUÔN quay lại"
- "Lệnh tốt nhất là lệnh KHÔNG vào khi không có setup"

**3. Rule cứng:**
- Nếu nến đã di chuyển >50% expected move → BỎ QUA
- Nếu không trong watchlist → KHÔNG TRADE
- Chờ pullback, không bao giờ đuổi giá` },

  "6-0-1": { title: "Revenge Trading", content: `### Revenge Trading là gì?

Sau khi thua lệnh, trader cảm thấy tức giận và muốn **"trả thù" thị trường** bằng cách vào lệnh ngay lập tức, thường với lot size lớn hơn.

### Vòng lặp chết người
1. Thua lệnh → Tức giận
2. Vào lệnh mới ngay (không có setup) → Thua tiếp
3. Càng tức hơn → Tăng lot size → Thua nặng hơn
4. Mất kiểm soát → Cháy tài khoản

### Nguyên nhân gốc
- **Ego:** "Mình không thể sai"
- **Loss Aversion:** Đau đớn vì mất tiền gấp 2x niềm vui khi được tiền
- **Thiếu kỷ luật:** Không có quy tắc dừng trade khi thua

### Giải pháp

**1. Daily Loss Limit (QUAN TRỌNG):**
- Quy tắc: Thua 2-3 lệnh HOẶC thua 3% vốn/ngày → **TẮT MÁY, NGHỈ**
- Không ngoại lệ. Không thương lượng.

**2. Cooling Period:**
- Sau mỗi lệnh thua: Nghỉ ít nhất 30-60 phút
- Rời khỏi chart, đi dạo, tập thể dục
- Quay lại khi đầu óc tỉnh táo

**3. Process-Oriented Mindset:**
- Tập trung vào **quy trình**, không phải kết quả
- Lệnh thua theo plan = THÀNH CÔNG (vì bạn tuân thủ plan)
- Lệnh thắng không theo plan = THẤT BẠI` },

**MQL (MetaQuotes Language)** là ngôn ngữ lập trình được dùng để tạo:
- **Expert Advisor (EA):** Robot giao dịch tự động
- **Custom Indicator:** Chỉ báo tùy chỉnh
- **Script:** Lệnh chạy một lần

### Cấu trúc EA cơ bản (MQL4)

\`\`\`
// Khởi tạo
int OnInit() { return(INIT_SUCCEEDED); }

// Xử lý mỗi tick
void OnTick() {
    // Kiểm tra điều kiện
    double ema20 = iMA(NULL, 0, 20, 0, MODE_EMA, PRICE_CLOSE, 0);
    double ema50 = iMA(NULL, 0, 50, 0, MODE_EMA, PRICE_CLOSE, 0);
    
    // Golden Cross → Buy
    if(ema20 > ema50 && OrdersTotal() == 0) {

    }
}
\`\`\`

### Quy trình phát triển EA
1. **Ý tưởng:** Chiến lược rõ ràng, có edge
2. **Code:** Viết EA theo chiến lược
3. **Backtest:** Strategy Tester trên data lịch sử
4. **Optimize:** Điều chỉnh parameters (cẩn thận overfitting!)
5. **Forward Test:** Chạy trên demo 3-6 tháng
6. **Live:** Bắt đầu với lot nhỏ nhất

### Cảnh báo
- 90%+ EA trên mạng là SCAM
- EA không phải "máy in tiền" — cần monitoring

// ─── MARKDOWN RENDERER ───
function Md({ text }) {
  if (!text) return null;
  const lines = text.split('\n');
  const elements = [];
  let i = 0;
  let tableRows = [];
  let inTable = false;

  const renderInline = (str) => {
    const parts = [];
    let remaining = str;
    let idx = 0;
    // Bold + Code inline
    const regex = /(\*\*(.+?)\*\*)|(`(.+?)`)/g;
    let match;
    let lastEnd = 0;
    while ((match = regex.exec(remaining)) !== null) {
      if (match.index > lastEnd) parts.push(<span key={idx++}>{remaining.slice(lastEnd, match.index)}</span>);
      if (match[2]) parts.push(<strong key={idx++} style={{ color: "#F1F5F9", fontWeight: 700 }}>{match[2]}</strong>);
      if (match[4]) parts.push(<code key={idx++} style={{ background: "#334155", padding: "1px 6px", borderRadius: 4, fontSize: "0.88em", color: "#38BDF8" }}>{match[4]}</code>);
      lastEnd = match.index + match[0].length;
    }
    if (lastEnd < remaining.length) parts.push(<span key={idx++}>{remaining.slice(lastEnd)}</span>);
    return parts.length ? parts : str;
  };

  while (i < lines.length) {
    const line = lines[i];

    // Table
    if (line.trim().startsWith('|')) {
      if (!inTable) { tableRows = []; inTable = true; }
      if (!line.trim().match(/^\|[\s-:|]+\|$/)) {
        tableRows.push(line.trim().split('|').filter(c => c.trim() !== '').map(c => c.trim()));
      }
      i++;
      if (i >= lines.length || !lines[i]?.trim().startsWith('|')) {
        inTable = false;
        const isHeader = tableRows.length > 0;
        elements.push(
          <div key={`t${i}`} style={{ overflowX: "auto", margin: "12px 0" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              {isHeader && <thead><tr>{tableRows[0].map((h, j) => <th key={j} style={{ padding: "8px 12px", background: "#334155", color: "#E2E8F0", fontWeight: 700, textAlign: "left", borderBottom: "2px solid #475569", whiteSpace: "nowrap" }}>{renderInline(h)}</th>)}</tr></thead>}
              <tbody>{tableRows.slice(1).map((row, ri) => <tr key={ri}>{row.map((cell, ci) => <td key={ci} style={{ padding: "6px 12px", borderBottom: "1px solid #1E293B", color: "#CBD5E1" }}>{renderInline(cell)}</td>)}</tr>)}</tbody>
            </table>
          </div>
        );
      }
      continue;
    }

    // Code block
    if (line.trim().startsWith('```')) {
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith('```')) {
        codeLines.push(lines[i]);
        i++;
      }
      elements.push(
        <pre key={`c${i}`} style={{ background: "#0F172A", border: "1px solid #334155", borderRadius: 8, padding: 14, overflowX: "auto", fontSize: 12, lineHeight: 1.6, color: "#38BDF8", margin: "12px 0" }}>
          <code>{codeLines.join('\n')}</code>
        </pre>
      );
      i++;
      continue;
    }

    // Headers
    if (line.startsWith('### ')) {
      elements.push(<h3 key={i} style={{ fontSize: 16, fontWeight: 800, color: "#F1F5F9", margin: "20px 0 8px", borderBottom: "1px solid #334155", paddingBottom: 6 }}>{line.slice(4)}</h3>);
      i++; continue;
    }

    // List items
    if (line.startsWith('- ')) {
      const listItems = [];
      while (i < lines.length && lines[i].startsWith('- ')) {
        listItems.push(lines[i].slice(2));
        i++;
      }
      elements.push(
        <ul key={`l${i}`} style={{ margin: "8px 0", paddingLeft: 20 }}>
          {listItems.map((item, j) => <li key={j} style={{ marginBottom: 4, lineHeight: 1.6, color: "#CBD5E1", fontSize: 13.5 }}>{renderInline(item)}</li>)}
        </ul>
      );
      continue;
    }

    // Warning/Highlight
    if (line.startsWith('⚠️') || line.startsWith('💡')) {
      elements.push(
        <div key={i} style={{ background: line.startsWith('⚠️') ? "#7C2D1220" : "#0D948820", border: `1px solid ${line.startsWith('⚠️') ? "#7C2D1244" : "#0D948844"}`, borderRadius: 8, padding: "10px 14px", margin: "12px 0", fontSize: 13, lineHeight: 1.6, color: "#E2E8F0" }}>
          {renderInline(line)}
        </div>
      );
      i++; continue;
    }

    // Empty line
    if (line.trim() === '') { i++; continue; }

    // Paragraph
    elements.push(<p key={i} style={{ margin: "8px 0", lineHeight: 1.7, color: "#CBD5E1", fontSize: 13.5 }}>{renderInline(line)}</p>);
    i++;
  }
  return <>{elements}</>;
}

            </div>

            <div style={{ marginTop: 30, padding: "18px 20px", borderRadius: 12, background: "#1E293B", border: "1px solid #334155", fontSize: 12, color: "#94A3B8", lineHeight: 1.8 }}>
              <strong style={{ color: "#FBBF24" }}>💡 Cách sử dụng:</strong><br />
              • Nhấn vào từng giai đoạn để xem danh sách bài học chi tiết<br />
              • Nhấn vào từng bài học để đọc kiến thức đầy đủ<br />
              • Tick hoàn thành để theo dõi tiến độ<br />
              • Dùng thanh tìm kiếm để nhảy nhanh đến bài học cần thiết
            </div>
            </div>

            {/* ─── DONATE PANEL (RIGHT SIDE) ─── */}
            {winWidth > 900 && <div style={{ width: 220, flexShrink: 0, position: "sticky", top: 70 }}>
              <div style={{ background: "linear-gradient(180deg, #1E293B, #15202E)", borderRadius: 16, border: "1px solid #334155", overflow: "hidden" }}>
                <div style={{ background: "linear-gradient(135deg, #38BDF8, #818CF8)", padding: "10px 14px", textAlign: "center", borderRadius: "16px 16px 0 0" }}>
                  <span style={{ fontSize: 13, fontWeight: 800, color: "#fff", letterSpacing: "0.5px" }}>Thanks for the support!</span>
                </div>
                <div style={{ padding: "12px" }}>
                  <div style={{ borderRadius: 10, overflow: "hidden", border: "2px solid #33415566", marginBottom: 10 }}>
                    <img src={QR_IMG} alt="QR Donate" style={{ width: "100%", display: "block" }} />
                  </div>
                  <p style={{ fontSize: 11, color: "#94A3B8", lineHeight: 1.6, textAlign: "center" }}>
                    Cảm ơn anh em đã ủng hộ <strong style={{ color: "#FBBF24" }}>Ben</strong> để có động lực phát triển và duy trì nền tảng này! 🙏
                  </p>
                </div>
              </div>
            </div>}
          </div>
        )}

        {/* ─── PHASE VIEW ─── */}
        {view === "phase" && phase && (
          <div style={{ padding: "24px", maxWidth: 800, margin: "0 auto" }}>
            <button onClick={() => setView("home")} style={{ border: "none", background: "none", color: "#64748B", fontSize: 12, cursor: "pointer", marginBottom: 12, padding: 0 }}>← Trang chủ</button>

            <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 20 }}>
              <span style={{ fontSize: 40 }}>{phase.icon}</span>
              <div>
                <h1 style={{ margin: 0, fontSize: 22, fontWeight: 900, color: phase.color }}>{phase.title}</h1>
                <p style={{ margin: "4px 0 0", color: "#94A3B8", fontSize: 13 }}>{phase.subtitle} • {phase.desc}</p>
              </div>
            </div>

            {phase.modules.map((mod, mi) => (
              <div key={mi} style={{ background: "#1E293B", borderRadius: 12, border: "1px solid #33415566", marginBottom: 14, overflow: "hidden" }}>
                <div style={{ padding: "14px 18px", borderBottom: "1px solid #33415544", display: "flex", alignItems: "center" }}>
                  <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "#E2E8F0", flex: 1 }}>{mod.name}</h3>
                  <span style={{ fontSize: 11, color: "#64748B" }}>
                    {mod.topics.filter((_, ti) => completed[`${phase.id}-${mi}-${ti}`]).length}/{mod.topics.length}
                  </span>
                </div>
                {mod.topics.map((topic, ti) => {
                  const key = `${phase.id}-${mi}-${ti}`;
                  const isDone = completed[key];
                  return (
                    <div key={ti} style={{ display: "flex", alignItems: "center", padding: "0 18px", borderBottom: ti < mod.topics.length - 1 ? "1px solid #ffffff06" : "none" }}>
                      <input type="checkbox" checked={!!isDone} onChange={() => toggleComplete(key)}
                        style={{ accentColor: phase.color, cursor: "pointer", marginRight: 12, flexShrink: 0 }} />
                      <button onClick={() => openLesson(phase.id, mi, ti)}
                        style={{ flex: 1, padding: "11px 0", border: "none", background: "none", color: isDone ? "#64748B" : "#CBD5E1", fontSize: 13, textAlign: "left", cursor: "pointer", textDecoration: isDone ? "line-through" : "none", lineHeight: 1.5 }}>
                        {topic}
                      </button>
                      <span style={{ color: "#334155", fontSize: 14, marginLeft: 8 }}>→</span>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        )}

        {/* ─── LESSON VIEW ─── */}
        {view === "lesson" && activeLesson && lessonData && (
          <div style={{ padding: "24px", maxWidth: 780, margin: "0 auto" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
              <button onClick={() => openPhase(activeLesson.phaseId)} style={{ border: "none", background: "none", color: "#64748B", fontSize: 12, cursor: "pointer", padding: 0 }}>
                ← {phase?.title}
              </button>
              <span style={{ color: "#334155" }}>/</span>
              <span style={{ fontSize: 12, color: "#64748B" }}>
                {phase?.modules[activeLesson.mi]?.name}
              </span>
            </div>

            {/* Lesson Header */}
            <div style={{ background: `${phase?.color}10`, border: `1px solid ${phase?.color}33`, borderRadius: 14, padding: "20px 24px", marginBottom: 20 }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 14 }}>
                <span style={{ fontSize: 32 }}>{phase?.icon}</span>
                <div style={{ flex: 1 }}>
                  <h1 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: "#F1F5F9", lineHeight: 1.3 }}>{lessonData.title}</h1>
                  <p style={{ margin: "6px 0 0", fontSize: 12, color: "#94A3B8" }}>
                    {phase?.title} • {phase?.modules[activeLesson.mi]?.name}
                  </p>
                </div>
                <button onClick={() => toggleComplete(`${activeLesson.phaseId}-${activeLesson.mi}-${activeLesson.ti}`)}
                  style={{ border: `2px solid ${phase?.color}`, borderRadius: 8, padding: "6px 14px", background: completed[`${activeLesson.phaseId}-${activeLesson.mi}-${activeLesson.ti}`] ? phase?.color : "transparent", color: completed[`${activeLesson.phaseId}-${activeLesson.mi}-${activeLesson.ti}`] ? "#fff" : phase?.color, fontSize: 12, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
                  {completed[`${activeLesson.phaseId}-${activeLesson.mi}-${activeLesson.ti}`] ? "✓ Hoàn thành" : "Đánh dấu xong"}
                </button>
              </div>
            </div>

            {/* Lesson Content */}
            <div style={{ background: "#1E293B", borderRadius: 14, padding: "24px 28px", border: "1px solid #33415566", lineHeight: 1.7 }}>
              <Md text={lessonData.content} />
            </div>

            {/* Navigation */}
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 20, gap: 12 }}>
              {currentLessonIdx > 0 ? (
                <button onClick={() => { const prev = allLessons[currentLessonIdx - 1]; openLesson(prev.phaseId, prev.mi, prev.ti); }}
                  style={{ flex: 1, padding: "12px 16px", border: "1px solid #334155", borderRadius: 10, background: "#1E293B", color: "#94A3B8", fontSize: 12, cursor: "pointer", textAlign: "left" }}>
                  ← Bài trước<br /><span style={{ color: "#CBD5E1", fontWeight: 600, fontSize: 11 }}>{allLessons[currentLessonIdx - 1].title.slice(0, 40)}...</span>
                </button>
              ) : <div style={{ flex: 1 }} />}
              {currentLessonIdx < allLessons.length - 1 ? (
                <button onClick={() => { const next = allLessons[currentLessonIdx + 1]; openLesson(next.phaseId, next.mi, next.ti); }}
                  style={{ flex: 1, padding: "12px 16px", border: "1px solid #334155", borderRadius: 10, background: "#1E293B", color: "#94A3B8", fontSize: 12, cursor: "pointer", textAlign: "right" }}>
                  Bài tiếp →<br /><span style={{ color: "#CBD5E1", fontWeight: 600, fontSize: 11 }}>{allLessons[currentLessonIdx + 1].title.slice(0, 40)}...</span>
                </button>
              ) : <div style={{ flex: 1 }} />}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ForexAcademy));
</script>
</body>
</html>
